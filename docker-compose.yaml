services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - botdata:/data
    expose:
      - "3000"

  caddy:                      # даёт https для Mini App автоматически
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN} --to bot:3000
    volumes:
      - caddydata:/data
    depends_on:
      - bot

volumes:
  botdata:
  caddydata:
