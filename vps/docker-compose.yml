services:
  render:
    build:
      context: ..
      dockerfile: vps/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      RENDER_TOKEN: ${RENDER_TOKEN}
      MAX_RENDERS: ${MAX_RENDERS:-1}
      WORK_DIR: /data/jobs
    volumes:
      - jobs:/data
    ports:
      - "8080:8080"

volumes:
  jobs:
